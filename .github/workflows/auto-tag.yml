name: Auto Tag Release

# Fixes the failure mode in issue #30: a manifest.json version bump that
# lands on main is worthless to HACS users until *something* pushes a
# matching `vX.Y.Z` tag — release.yml only runs on tag push, and nothing
# was doing that automatically, so it depended on a human remembering a
# manual step. This closes that gap without duplicating release.yml's own
# job (test → validate → create the GitHub Release): it only tags: it
# leaves creating the actual release to the existing tag-triggered
# workflow, so there is exactly one place that decides whether a version
# is fit to publish.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check manifest version against existing tags
        id: check
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/concierge_mcp/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.check.outputs.version }}" -m "Release v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
