name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pytest
        run: pytest tests/ --cov=custom_components.concierge_mcp

      - name: Validate manifest version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/concierge_mcp/manifest.json'))['version'])")
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
